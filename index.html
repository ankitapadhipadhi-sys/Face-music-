<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Structure Music Player</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
    h2 { margin-bottom: 5px; }
    #setup-screen, #camera-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
    #camera-screen { display: none; }
    .button-group { display: flex; gap: 15px; margin-top: 20px; }
    button { padding: 14px 28px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .gender-btn { background: #333; color: white; border: 2px solid transparent; }
    .gender-btn.active { border-color: #1DB954; background: #1DB954; }
    #start-btn { background: #1DB954; color: white; margin-top: 30px; display: none; }
    video { transform: scaleX(-1); border-radius: 12px; width: 90%; max-width: 400px; margin-top: 15px; background: #000; }
    #status { margin-top: 15px; color: #aaa; }
  </style>
</head>
<body>

  <!-- Screen 1: Selection -->
  <div id="setup-screen">
    <h2>AI Face Music Player</h2>
    <p>Select a playlist category:</p>
    <div class="button-group">
      <button class="gender-btn" id="btn-boys" onclick="selectGender('boys')">Boys</button>
      <button class="gender-btn" id="btn-girls" onclick="selectGender('girls')">Girls</button>
    </div>
    <button id="start-btn" onclick="goToCamera()">Continue to Scan</button>
  </div>

  <!-- Screen 2: Camera & Scanning -->
  <div id="camera-screen">
    <h2>Scanning Face</h2>
    <video id="webcam" autoplay playsinline muted></video>
    <h3 id="status">Wait...</h3>
  </div>

  <script>
    let selectedPlaylistType = null;
    let triggered = false;
    let video = null;

    // --- Search Queries (Prevents "Video Unavailable" errors completely) ---
    const playlists = {
      boys: [
        "https://www.youtube.com/results?search_query=Apna+Bana+Le+Song",
        "https://www.youtube.com/results?search_query=Shayad+Arijit+Singh+Song",
        "https://www.youtube.com/results?search_query=Tum+Hi+Ho+Song",
        "https://www.youtube.com/results?search_query=Raataan+Lambiyan+Song",
        "https://www.youtube.com/results?search_query=Tera+Ban+Jaunga+Song",
        "https://www.youtube.com/results?search_query=Kal+Ho+Naa+Ho+Title+Track",
        "https://www.youtube.com/results?search_query=Pehlee+Bhi+Main+Animal+Song",
        "https://www.youtube.com/results?search_query=Kabira+Yeh+Jawaani+Hai+Deewani",
        "https://www.youtube.com/results?search_query=Chaleya+Jawan+Song",
        "https://www.youtube.com/results?search_query=Tum+Se+Hi+Jab+We+Met"
      ],
      girls: [
        "https://www.youtube.com/results?search_query=Kesariya+Brahmastra+Song",
        "https://www.youtube.com/results?search_query=Param+Sundari+Mimi+Song",
        "https://www.youtube.com/results?search_query=Nainowale+Ne+Padmaavat",
        "https://www.youtube.com/results?search_query=Deewani+Mastani+Song",
        "https://www.youtube.com/results?search_query=Ghar+More+Pardesiya+Kalank",
        "https://www.youtube.com/results?search_query=Dil+Diyan+Gallan+Song",
        "https://www.youtube.com/results?search_query=Manwa+Laage+Happy+New+Year",
        "https://www.youtube.com/results?search_query=Lehra+Do+83+Song",
        "https://www.youtube.com/results?search_query=Tere+Waaste+Zara+Hatke+Zara+Bachke",
        "https://www.youtube.com/results?search_query=Ranjhana+Jasleen+Royal+Song"
      ]
    };

    function selectGender(gender) {
      selectedPlaylistType = gender;
      document.getElementById('btn-boys').classList.remove('active');
      document.getElementById('btn-girls').classList.remove('active');
      document.getElementById('btn-'+gender).classList.add('active');
      document.getElementById('start-btn').style.display = 'block';
    }

    function goToCamera() {
      if (!selectedPlaylistType) return;
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('camera-screen').style.display = 'flex';
      startCamera();
    }

    async function startCamera() {
      document.getElementById('status').innerText = "Initializing Camera...";
      video = document.getElementById('webcam');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        await video.play();

        document.getElementById('status').innerText = `Scanning face structure...`;
        
        setTimeout(() => {
          if (!triggered) {
            triggered = true;
            document.getElementById('status').innerText = "Face Detected! Launching YouTube...";
            
            const currentPlaylist = playlists[selectedPlaylistType];
            const selectedSong = currentPlaylist[Math.floor(Math.random() * currentPlaylist.length)];
            
            setTimeout(() => {
              window.location.href = selectedSong;
            }, 1000);
          }
        }, 3500);

      } catch (err) {
        document.getElementById('status').innerText = "Error: Camera access denied. Check permissions.";
      }
    }
  </script>
</body>
</html>
