<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Structure Music Player</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      background: #121212; 
      color: white; 
      padding: 20px; 
    }
    video { 
      transform: scaleX(-1); 
      border-radius: 12px; 
      width: 90%; 
      max-width: 400px; 
      margin-top: 15px; 
    }
    button { 
      padding: 14px 28px; 
      font-size: 18px; 
      font-weight: bold; 
      border: none; 
      border-radius: 8px; 
      background: #1DB954; 
      color: white; 
      margin-top: 10px; 
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>AI Face Music Player</h2>
  <p>Scan your face to play tailored music!</p>
  <button onclick="startApp()">Open Camera & Scan Face</button>
  <br>
  <video id="webcam" autoplay playsinline muted></video>
  <h3 id="status">Tap the button to start</h3>

  <script>
    let video, triggered = false;

    // Add or change your YouTube music links here
    const songs = [
      "https://www.youtube.com/watch?v=BddP6PYo2gs",
      "https://www.youtube.com/watch?v=hoNb6huNbU0",
      "https://www.youtube.com/watch?v=ElZfdU54Cp8"
    ];

    async function startApp() {
      document.getElementById('status').innerText = "Starting Camera...";
      video = document.getElementById('webcam');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: false 
        });
        video.srcObject = stream;
        await video.play();

        document.getElementById('status').innerText = "Scanning face structure...";
        
        // Simulates scanning and redirects to YouTube after 3 seconds
        setTimeout(() => {
          if (!triggered) {
            triggered = true;
            document.getElementById('status').innerText = "Face Detected! Launching YouTube...";
            const selectedSong = songs[Math.floor(Math.random() * songs.length)];
            setTimeout(() => {
              window.location.href = selectedSong;
            }, 1000);
          }
        }, 3000);

      } catch (err) {
        document.getElementById('status').innerText = "Camera access error. Please check browser permissions.";
      }
    }
  </script>
</body>
</html>
