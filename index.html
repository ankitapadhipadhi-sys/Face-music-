<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Structure Music Player</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/face-landmarks-detection"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
    video { transform: scaleX(-1); border-radius: 12px; width: 90%; max-width: 400px; margin-top: 15px; }
    button { padding: 14px 28px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; background: #1DB954; color: white; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>AI Face Music Player</h2>
  <p>Scan your face to play tailored music!</p>
  <button onclick="startApp()">Open Camera & Scan Face</button>
  <br>
  <video id="webcam" autoplay playsinline></video>
  <h3 id="status">Tap the button to start</h3>

  <script>
    let model, video, triggered = false;

    // Songs List
    const songs = [
      "https://www.youtube.com/watch?v=BddP6PYo2gs&autoplay=1",
      "https://www.youtube.com/watch?v=hoNb6huNbU0&autoplay=1",
      "https://www.youtube.com/watch?v=ElZfdU54Cp8&autoplay=1"
    ];

    async function startApp() {
      document.getElementById('status').innerText = "Loading AI Camera...";
      video = document.getElementById('webcam');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;

        model = await faceLandmarksDetection.load(
          faceLandmarksDetection.SupportedPackages.mediapipeFacemesh
        );

        document.getElementById('status').innerText = "Look into the camera...";
        detectFace();
      } catch (err) {
        document.getElementById('status').innerText = "Camera access denied or unsupported.";
      }
    }

    async function detectFace() {
      if (triggered) return;
      const predictions = await model.estimateFaces({ input: video });

      if (predictions.length > 0) {
        triggered = true;
        document.getElementById('status').innerText = "Face Detected! Launching Music...";
        const selectedSong = songs[Math.floor(Math.random() * songs.length)];
        window.location.href = selectedSong;
      } else {
        requestAnimationFrame(detectFace);
      }
    }
  </script>
</body>
</html>
